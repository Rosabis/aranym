name: Build Windows

# Build ARAnyM for Windows with MSYS2 (UCRT64) and upload the resulting zip as a
# GitHub Actions artifact.
#
# Note on targets: MSYS2 has deprecated MINGW32 (32-bit) and is phasing out its
# 32-bit package set, and `mingw-w64-libusb` is no longer built for the MSVCRT
# (MINGW64) environment. We therefore build on UCRT64, which is MSYS2's
# recommended modern 64-bit runtime and still ships every dependency (including
# libusb). If you need an MSVCRT/Win7-era binary, add a MINGW64 matrix entry and
# drop `--enable-usbhost` from CONFIGURE_ARGS in tools/build-windows.sh.
on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: write   # checkout (read) + attach assets to a GitHub Release
  actions: read     # required by actions/upload-artifact@v4

jobs:
  build-windows:
    name: Windows (${{ matrix.msystem }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - msystem: UCRT64
            prefix: ucrt-x86_64
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for git log / short commit id

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          cache: true
          # MSYS2's SDL2 package is the sdl2-compat shim (Provides sdl2-compat);
          # its SDL2.dll dynamically loads SDL3.dll at runtime, so we must also
          # ship SDL3.dll or aranym fails with "Failed loading SDL3 library."
          install: >-
            base-devel
            autotools
            git
            mingw-w64-${{ matrix.prefix }}-toolchain
            mingw-w64-${{ matrix.prefix }}-binutils
            mingw-w64-${{ matrix.prefix }}-SDL2
            mingw-w64-${{ matrix.prefix }}-sdl3
            mingw-w64-${{ matrix.prefix }}-SDL2_image
            mingw-w64-${{ matrix.prefix }}-libjpeg-turbo
            mingw-w64-${{ matrix.prefix }}-libpng
            mingw-w64-${{ matrix.prefix }}-zlib
            mingw-w64-${{ matrix.prefix }}-gmp
            mingw-w64-${{ matrix.prefix }}-mpfr
            mingw-w64-${{ matrix.prefix }}-libusb
            mingw-w64-${{ matrix.prefix }}-freetype
            mingw-w64-${{ matrix.prefix }}-fontconfig
            zip

      - name: Build and package
        id: build
        run: ./tools/build-windows.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aranym-windows-${{ matrix.msystem }}
          path: aranym-*.zip
          if-no-files-found: error

      # Only attach the builds to the GitHub Release when this run was
      # triggered by publishing a release.
      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: aranym-*.zip
